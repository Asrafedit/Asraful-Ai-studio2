<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asraful AI Studio</title>
<style>
:root{
  --bg:#070b12;--panel:#0e1622;--panel2:#141f2d;--panel3:#192638;
  --text:#f7f9fc;--muted:#93a1b2;--line:#223044;--accent:#16a085;
  --accent2:#0f806b;--danger:#ef6b73;--shadow:0 18px 55px #0008;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(circle at 70% 0%,#12342d 0,#070b12 38%);color:var(--text);
font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;width:100%;height:100dvh}
.side{width:285px;flex:0 0 285px;background:#070c13eF;border-right:1px solid var(--line);
padding:14px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;padding:9px 8px 14px}
.brand b{color:#39d6b0}
.new,.side button{border:1px solid var(--line);background:var(--panel);color:var(--text);
border-radius:12px;padding:11px 12px;text-align:left;transition:.18s}
.new:hover,.side button:hover{background:var(--panel2);border-color:#34506c}
.new{background:linear-gradient(135deg,#116d5b,#159d82);border-color:transparent}
.history{overflow:auto;flex:1;min-height:80px;padding-right:2px}
.history button{display:block;width:100%;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.login{background:var(--accent)!important;border-color:transparent!important;text-align:center!important}
.userbar{display:none;align-items:center;gap:9px;padding:9px;background:var(--panel);
border:1px solid var(--line);border-radius:12px;overflow:hidden}
.userbar img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.userbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
.top{height:60px;flex:0 0 60px;border-bottom:1px solid var(--line);display:flex;align-items:center;
padding:0 18px;gap:10px;background:#070b12cc;backdrop-filter:blur(15px)}
.top strong{font-size:15px}
.status{margin-left:auto;color:var(--muted);font-size:12px}
.menu{display:none;background:transparent;border:0;color:var(--text);font-size:24px;padding:5px}
.chat{flex:1;overflow:auto;scroll-behavior:smooth}
.welcome{width:min(900px,100%);margin:clamp(50px,12vh,130px) auto 0;padding:20px 18px 150px;text-align:center}
.welcome h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 14px;letter-spacing:-1.5px}
.welcome p{margin:0 auto;color:var(--muted);max-width:650px;font-size:14px;line-height:1.7}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:28px auto 0;max-width:700px}
.card{padding:16px;background:linear-gradient(145deg,var(--panel),#0b121c);color:var(--text);
border:1px solid var(--line);border-radius:16px;text-align:left;min-height:88px;transition:.18s}
.card:hover{transform:translateY(-2px);border-color:#36516c;background:var(--panel2)}
.card small{display:block;color:var(--muted);margin-top:7px;font-size:12px}
.messages{width:min(900px,100%);margin:auto;padding:24px 18px 150px}
.msg{display:flex;gap:12px;margin:20px 0;line-height:1.7;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.avatar{width:32px;height:32px;min-width:32px;border-radius:10px;background:var(--panel2);
display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line)}
.user{flex-direction:row-reverse}
.user .avatar{background:var(--accent);border-color:transparent}
.bubble{white-space:pre-wrap;max-width:min(760px,calc(100% - 45px));word-break:break-word}
.user .bubble{text-align:right}
.composer-wrap{position:fixed;left:285px;right:0;bottom:0;padding:10px 18px 16px;
background:linear-gradient(transparent,#070b12 28%);z-index:4}
.composer{width:min(900px,100%);margin:auto;display:flex;align-items:end;gap:5px;
background:#101a27eF;border:1px solid #2b3b50;border-radius:18px;padding:7px;
box-shadow:0 12px 45px #0009;backdrop-filter:blur(16px)}
.composer textarea{flex:1;min-width:0;background:transparent;color:var(--text);border:0;outline:0;
resize:none;padding:10px 8px;max-height:150px;line-height:1.45}
.icon,.send{border:0;border-radius:12px;padding:10px;min-width:40px;height:40px}
.icon{background:transparent;color:#cbd4df}
.icon:hover{background:var(--panel2)}
.send{background:var(--accent);color:#fff;font-weight:800}
.hint{text-align:center;color:#68788b;font-size:10px;margin-top:6px}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;
padding:16px;z-index:20}
.modal{width:min(520px,100%);max-height:90dvh;overflow:auto;background:var(--panel);
border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.modal h2{margin-top:0}
.modal input{width:100%;padding:12px;background:#0a1018;color:var(--text);border:1px solid var(--line);
border-radius:10px;margin:8px 0 14px;outline:0}
.modal input:focus{border-color:var(--accent)}
.primary{background:var(--accent);color:white;border:0;padding:10px 15px;border-radius:10px}
.preview{display:block;max-width:100%;max-height:58dvh;margin:auto;border-radius:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c2938;
border:1px solid #314257;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:30;
max-width:calc(100% - 30px);text-align:center;font-size:13px}
@media(max-width:760px){
  .side{position:fixed;top:0;bottom:0;left:0;width:min(86vw,300px);z-index:15;
  transform:translateX(-105%);transition:transform .22s ease;box-shadow:20px 0 60px #0008}
  .side.open{transform:translateX(0)}
  .menu{display:block}
  .composer-wrap{left:0;padding:8px 9px calc(8px + env(safe-area-inset-bottom))}
  .top{height:54px;flex-basis:54px;padding:0 10px}
  .status{display:none}
  .welcome{margin-top:7vh;padding-left:12px;padding-right:12px}
  .welcome h1{font-size:34px}
  .cards{grid-template-columns:1fr;gap:9px}
  .card{min-height:70px;padding:13px}
  .messages{padding-left:12px;padding-right:12px}
  .msg{gap:8px;margin:17px 0}
  .bubble{max-width:calc(100% - 40px)}
  .composer textarea{font-size:15px}
  .hint{font-size:9px}
}
@media(max-width:380px){
  .welcome h1{font-size:29px}
  .composer{border-radius:15px}
  .icon,.send{min-width:36px;width:36px;padding:8px}
}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
<div class="brand">✦ Asraful <b>AI Studio</b></div>
<div id="userbar" class="userbar"></div>
<button class="new" onclick="newChat()">＋ New chat</button>
<div class="history" id="history"></div>
<button onclick="openSettings()">⚙ Settings</button>
<button id="loginBtn" class="login" onclick="googleLogin()">Sign in with Google</button>
</aside>
<main class="main">
<header class="top"><button class="menu" onclick="toggleSide()">☰</button><strong>Asraful AI Studio</strong><span class="status" id="status">Ready</span></header>
<section class="chat" id="chat">
<div class="welcome" id="welcome"><h1>How can I help you?</h1><p>প্রশ্ন করো, লেখা তৈরি করো, voice ব্যবহার করো, অথবা ছবি/ভিডিও preview করো।</p>
<div class="cards">
<button class="card" onclick="promptText('একটি সুন্দর বাংলা ক্যাপশন লিখে দাও')">✍️ Writing<small>ক্যাপশন, পোস্ট, গল্প</small></button>
<button class="card" onclick="promptText('এই বিষয়টি সহজ বাংলায় বুঝিয়ে দাও: ')">💡 Explain<small>সহজভাবে বুঝে নাও</small></button>
<button class="card" onclick="choose('image')">🖼️ Image<small>ছবি upload ও preview</small></button>
<button class="card" onclick="choose('video')">🎬 Video<small>ভিডিও upload ও preview</small></button>
</div></div><div class="messages" id="messages"></div>
</section></main></div>

<div class="composer-wrap"><div class="composer">
<button class="icon" aria-label="Attach file" title="Attach image or video" onclick="choose('image')">＋</button>
<textarea id="input" rows="1" placeholder="Message Asraful AI Studio..." oninput="resizeBox(this)" onkeydown="keySend(event)"></textarea>
<button class="icon" onclick="voiceInput()">🎙</button><button class="send" onclick="sendMessage()">↑</button>
</div><div class="hint">Firebase Login + Firestore + App Check enabled. AI needs /api/chat backend.</div></div>

<input id="file" type="file" hidden>
<div class="overlay" id="settingsBox"><div class="modal"><h2>Settings</h2><label>Backend API URL</label><input id="api"><p style="color:#9aa6b2;font-size:13px">ডিফল্ট: /api/chat</p><button class="primary" onclick="saveSettings()">Save</button></div></div>
<div class="overlay" id="mediaBox"><div class="modal"><h2 id="mediaTitle">Preview</h2><div id="media"></div><button class="primary" onclick="closeMedia()">Close</button></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithRedirect,getRedirectResult,signOut} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getFirestore,collection,addDoc,query,where,orderBy,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import {initializeAppCheck, ReCaptchaEnterpriseProvider, getToken} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app-check.js";

const firebaseConfig={apiKey:"AIzaSyA8whR7kKgOVH-qZzhBzP4as5qAYOrdxBs",authDomain:"asraful-ai-studio.firebaseapp.com",projectId:"asraful-ai-studio",storageBucket:"asraful-ai-studio.firebasestorage.app",messagingSenderId:"40427917531",appId:"1:40427917531:web:d4f52b7eadf6ca9d82fcfe",measurementId:"G-XZCRLQYRB3"};
const app=initializeApp(firebaseConfig);

// Firebase App Check — replace this placeholder with the SAME
// reCAPTCHA Enterprise Web key used when registering "asra ai web"
// in Firebase Console → Security → App Check.
const RECAPTCHA_ENTERPRISE_SITE_KEY="6LdsmNktAAAAAPepMgxLUDmTUDKe6Wa-_CSxRvMr";
const appCheck=initializeAppCheck(app,{
  provider:new ReCaptchaEnterpriseProvider(RECAPTCHA_ENTERPRISE_SITE_KEY),
  isTokenAutoRefreshEnabled:true
});

const auth=getAuth(app),db=getFirestore(app);
const provider=new GoogleAuthProvider();
let current=[],apiUrl=localStorage.getItem("asraful_api")||"/api/chat",user=null;
const $=id=>document.getElementById(id);
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}
window.toggleSide=()=>$("side").classList.toggle("open");
window.resizeBox=x=>{x.style.height="auto";x.style.height=Math.min(x.scrollHeight,150)+"px"};
window.keySend=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();window.sendMessage()}};
window.promptText=x=>{$("input").value=x;$("input").focus();window.resizeBox($("input"))};
function addMessage(role,text,save=true){$("welcome").style.display="none";let d=document.createElement("div");d.className="msg "+role;d.innerHTML='<div class="avatar">'+(role==="user"?"You":"AI")+'</div><div class="bubble"></div>';d.querySelector(".bubble").textContent=text;$("messages").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight;if(save)current.push({role:role==="user"?"user":"assistant",content:text})}
window.sendMessage=async()=>{let x=$("input"),t=x.value.trim();if(!t)return;addMessage("user",t);x.value="";window.resizeBox(x);$("status").textContent="Thinking…";try{let appCheckToken="";
try{
  const tokenResult=await getToken(appCheck,false);
  appCheckToken=tokenResult.token||"";
}catch(e){
  console.warn("App Check token unavailable:",e);
}
let r=await fetch(apiUrl,{
  method:"POST",
  headers:{
    "Content-Type":"application/json",
    ...(appCheckToken?{"X-Firebase-AppCheck":appCheckToken}:{})
  },
  body:JSON.stringify({messages:current})
});let d=await r.json();if(!r.ok)throw Error(d.details||d.error||("HTTP "+r.status));addMessage("assistant",d.reply||d.message||d.content||"No reply")}catch(e){addMessage("assistant","AI backend error: "+e.message)}$("status").textContent="Ready";await saveChat()};
async function saveChat(){if(!user||current.length===0)return;try{await addDoc(collection(db,"users",user.uid,"chats"),{title:current.find(x=>x.role==="user")?.content?.slice(0,60)||"New chat",messages:current,createdAt:serverTimestamp()});await loadHistory()}catch(e){console.error(e)}}
async function loadHistory(){if(!user)return;try{let q=query(collection(db,"users",user.uid,"chats"),orderBy("createdAt","desc"));let snap=await getDocs(q);let h=$("history");h.innerHTML="";snap.forEach(doc=>{let c=doc.data(),b=document.createElement("button");b.textContent=c.title||"Chat";b.onclick=()=>{current=[];$("messages").innerHTML="";$("welcome").style.display="none";(c.messages||[]).forEach(m=>addMessage(m.role,m.content,false))};h.appendChild(b)})}catch(e){console.error(e);toast("Firestore history load failed")}}
window.newChat=()=>{current=[];$("messages").innerHTML="";$("welcome").style.display="block"};
window.openSettings=()=>{$("api").value=apiUrl;$("settingsBox").style.display="flex"};
window.saveSettings=()=>{apiUrl=$("api").value.trim()||"/api/chat";localStorage.setItem("asraful_api",apiUrl);$("settingsBox").style.display="none";toast("Settings saved")};
window.googleLogin=async()=>{try{await signInWithRedirect(auth,provider)}catch(e){toast(e.message)}};
window.choose=kind=>{let f=$("file");f.accept=kind==="image"?"image/*":"video/*";f.click()};
$("file").onchange=()=>{let f=$("file").files[0];if(!f)return;let u=URL.createObjectURL(f);$("mediaTitle").textContent=f.name;$("media").innerHTML=f.type.startsWith("image/")?'<img class="preview" src="'+u+'">':'<video class="preview" controls src="'+u+'"></video>';$("mediaBox").style.display="flex";$("file").value=""};
window.closeMedia=()=>{$("mediaBox").style.display="none";$("media").innerHTML=""};

for(const id of ["settingsBox","mediaBox"]){
  $(id).addEventListener("click",e=>{if(e.target.id===id)e.currentTarget.style.display="none"});
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    $("settingsBox").style.display="none";
    $("mediaBox").style.display="none";
    $("side").classList.remove("open");
  }
});

window.voiceInput=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast("এই browser-এ voice input নেই");let r=new R();r.lang="bn-BD";r.onresult=e=>window.promptText(e.results[0][0].transcript);r.start();toast("বলুন…")};

onAuthStateChanged(auth,async u=>{user=u;if(u){$("loginBtn").textContent="Sign out";$("loginBtn").onclick=()=>signOut(auth);$("userbar").style.display="flex";$("userbar").innerHTML=(u.photoURL?'<img src="'+u.photoURL+'">':"👤")+"<span>"+(u.displayName||u.email)+"</span>";await loadHistory()}else{$("loginBtn").textContent="Sign in with Google";$("loginBtn").onclick=window.googleLogin;$("userbar").style.display="none"}});
try{await getRedirectResult(auth)}catch(e){console.error(e)}
</script>
</body></html>
